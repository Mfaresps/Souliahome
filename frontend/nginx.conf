server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression — load-bearing, not an optimization. index.html is ~4.5MB and is served
    # no-store (see below), so every open/refresh re-downloads it in full. gzip takes that
    # to ~1.0MB. Removing this does not break anything visibly; it just silently costs every
    # user ~3.5MB on every single page load.
    gzip on;
    gzip_comp_level 6;              # ~best size/CPU tradeoff; 9 costs much more for ~2% gain
    gzip_min_length 1024;           # below this, compression overhead exceeds the saving
    gzip_proxied any;
    gzip_vary on;                   # correct caching for proxies serving both encodings
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;
    # NOTE: text/html is ALWAYS gzipped by nginx and must not be listed above —
    # naming it explicitly triggers a "duplicate MIME type" warning.

    # The whole app is one file (index.html). Without an explicit no-store the browser
    # applies heuristic caching and a "reload" can silently re-serve the OLD build —
    # which would make the force-update dialog reappear in a loop. Never cache the shell.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Deploy marker polled by the running app — must never be cached, or clients would
    # keep reading the version of the build they already have.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Upstream is the Docker Compose service name (not localhost — backend runs in another container).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
