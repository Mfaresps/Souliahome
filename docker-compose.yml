services:
  mongodb:
    image: mongo:7
    container_name: soulia-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: soulia
      MONGO_INITDB_ROOT_PASSWORD: soulia_secret_2024
      MONGO_INITDB_DATABASE: soulia
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - soulia-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soulia-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://soulia:soulia_secret_2024@mongodb:27017/soulia?authSource=admin
      JWT_SECRET: soulia_jwt_super_secret_key_2024
      PORT: 3000
      # ⚠ الحاوية كانت شغّالة UTC (مافيش TZ)، والسيرفر المحلي UTC+3 — فنفس الكود
      # كان بيدّي نتيجتين مختلفتين حسب مكان التشغيل. ده بيأثر على كل حساب بيبني
      # تاريخاً بتوقيت السيرفر: بداية الشهر في `resolvePeriod` (نقاط اتكسبت بين
      # ١٢ و٣ فجراً يوم ١ كانت بتتحسب على الشهر اللي فات على حاوية UTC)، و
      # `new Date().toISOString().split('T')[0]` المنتشرة في المصاريف وأوامر
      # الشراء وغيرها.
      # `BUSINESS_TZ` بتاعة الورديات مستقلة عن دي عن قصد — الورديات بتتحل عبر
      # `Intl` فبتفضل صح مهما كان توقيت الحاوية؛ ده بيظبّط الباقي.
      TZ: ${TZ:-Africa/Cairo}
      BUSINESS_TZ: ${BUSINESS_TZ:-Africa/Cairo}
    ports:
      - '3001:3000'
    volumes:
      # createBackup() writes to path.join(process.cwd(), 'backups') — process.cwd() is /app
      # (Dockerfile WORKDIR). Without this volume every deploy replaces the container and takes
      # all manual backups with it.
      - backend-backups:/app/backups
    depends_on:
      - mongodb
    networks:
      - soulia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Supplied by CI (Jenkins exports BUILD_NUMBER); defaults to "dev" locally.
        # Written into /version.json at image build — the deploy marker clients poll.
        BUILD_NUMBER: ${BUILD_NUMBER:-dev}
    container_name: soulia-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend
    networks:
      - soulia-net

volumes:
  mongo-data:
  backend-backups:

networks:
  soulia-net:
    driver: bridge
